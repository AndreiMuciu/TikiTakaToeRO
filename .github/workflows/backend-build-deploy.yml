name: Backend Build and Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to deploy (default latest)
        required: false
        default: latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate deployment settings
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "Missing secret: DOCKERHUB_USERNAME"
            exit 1
          fi
          if [ -z "${{ secrets.VM_HOST }}" ]; then
            echo "Missing secret: VM_HOST"
            exit 1
          fi
          if [ -z "${{ secrets.VM_USER }}" ]; then
            echo "Missing secret: VM_USER"
            exit 1
          fi
          if [ -z "${{ secrets.VM_PASSWORD }}" ]; then
            echo "Missing secret: VM_PASSWORD"
            exit 1
          fi

      - name: Select image tag
        id: tag
        run: |
          echo "image_tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"

      - name: Deploy backend on VM over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          port: ${{ secrets.VM_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail

            IMAGE_REPO="${{ secrets.DOCKERHUB_USERNAME }}/backend-tikitakatoero"
            IMAGE_TAG="${{ steps.tag.outputs.image_tag }}"
            CONTAINER_NAME="${{ vars.BACKEND_CONTAINER_NAME }}"
            HOST_PORT="${{ vars.BACKEND_HOST_PORT }}"
            CONTAINER_PORT="${{ vars.BACKEND_CONTAINER_PORT }}"
            ENV_FILE_PATH="${{ vars.BACKEND_ENV_FILE_PATH }}"

            if [ -z "$CONTAINER_NAME" ]; then CONTAINER_NAME="TikiTakaToeRO-backend-app"; fi
            if [ -z "$HOST_PORT" ]; then HOST_PORT="5000"; fi
            if [ -z "$CONTAINER_PORT" ]; then CONTAINER_PORT="5000"; fi
            if [ -z "$ENV_FILE_PATH" ]; then ENV_FILE_PATH="/opt/tikitakatoe/backend/config.env"; fi

            if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
              echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            fi

            docker pull "$IMAGE_REPO:$IMAGE_TAG"

            OLD_IMAGE_ID="$(docker inspect -f '{{.Image}}' "$CONTAINER_NAME" 2>/dev/null || true)"

            if docker ps -a --format '{{.Names}}' | grep -Fxq "$CONTAINER_NAME"; then
              docker stop "$CONTAINER_NAME" || true
              docker rm "$CONTAINER_NAME" || true
            fi

            # No CPU/memory limits are set, so the container can use available VM resources.
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --env-file "$ENV_FILE_PATH" \
              -p "$HOST_PORT:$CONTAINER_PORT" \
              "$IMAGE_REPO:$IMAGE_TAG"

            NEW_IMAGE_ID="$(docker inspect -f '{{.Image}}' "$CONTAINER_NAME")"
            if [ -n "$OLD_IMAGE_ID" ] && [ "$OLD_IMAGE_ID" != "$NEW_IMAGE_ID" ]; then
              docker image rm "$OLD_IMAGE_ID" || true
            fi

            docker image prune -f

            echo "Deploy completed with image $IMAGE_REPO:$IMAGE_TAG"
