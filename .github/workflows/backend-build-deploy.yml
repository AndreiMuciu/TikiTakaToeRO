name: Deploy backend stack to VM

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to deploy (default latest)
        required: false
        default: latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate deployment settings
        run: |
          if [ -z "${{ secrets.VM_HOST }}" ]; then
            echo "Missing secret: VM_HOST"
            exit 1
          fi
          if [ -z "${{ secrets.VM_USER }}" ]; then
            echo "Missing secret: VM_USER"
            exit 1
          fi
          if [ -z "${{ secrets.VM_PASSWORD }}" ]; then
            echo "Missing secret: VM_PASSWORD"
            exit 1
          fi

      - name: Select image tag
        id: tag
        run: |
          echo "image_tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"

      - name: Deploy backend stack on VM over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          port: ${{ secrets.VM_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail
            set -x

            PROJECT_PATH="${{ vars.DEPLOY_PROJECT_PATH }}"
            COMPOSE_FILE="${{ vars.DEPLOY_COMPOSE_FILE }}"
            ENV_FILE_PATH="${{ vars.BACKEND_ENV_FILE_PATH }}"
            REPO_URL="${{ vars.DEPLOY_REPO_URL }}"
            REPO_BRANCH="${{ vars.DEPLOY_REPO_BRANCH }}"

            if [ -z "$PROJECT_PATH" ]; then PROJECT_PATH="/opt/tikitakatoe"; fi
            if [ -z "$COMPOSE_FILE" ]; then COMPOSE_FILE="docker-compose.yml"; fi
            if [ -z "$REPO_URL" ]; then REPO_URL="https://github.com/${{ github.repository }}.git"; fi
            if [ -z "$REPO_BRANCH" ]; then REPO_BRANCH="${{ github.ref_name }}"; fi

            # Clone only once; on next deploys just update existing repository.
            if [ ! -d "$PROJECT_PATH/.git" ]; then
              mkdir -p "$PROJECT_PATH"
              if [ -n "$(ls -A "$PROJECT_PATH" 2>/dev/null)" ]; then
                echo "Project path exists but is not a git repository: $PROJECT_PATH"
                echo "Using existing files on VM (skipping git sync)."
              else
                git clone --depth 1 --branch "$REPO_BRANCH" "$REPO_URL" "$PROJECT_PATH"
              fi
            else
              git -C "$PROJECT_PATH" fetch --all --prune
              if git -C "$PROJECT_PATH" show-ref --verify --quiet "refs/heads/$REPO_BRANCH"; then
                git -C "$PROJECT_PATH" checkout "$REPO_BRANCH"
              else
                git -C "$PROJECT_PATH" checkout -b "$REPO_BRANCH" "origin/$REPO_BRANCH"
              fi
              git -C "$PROJECT_PATH" reset --hard "origin/$REPO_BRANCH"
            fi

            if [ -z "$ENV_FILE_PATH" ]; then ENV_FILE_PATH="$PROJECT_PATH/backend/config.env"; fi

            cd "$PROJECT_PATH"
            echo "Using project path: $PROJECT_PATH"
            echo "Using compose file: $COMPOSE_FILE"
            echo "Using env file: $ENV_FILE_PATH"

            if [ ! -f "$COMPOSE_FILE" ]; then
              echo "Compose file not found: $PROJECT_PATH/$COMPOSE_FILE"
              exit 1
            fi

            if [ ! -f "$ENV_FILE_PATH" ]; then
              echo "Env file not found: $ENV_FILE_PATH"
              exit 1
            fi

            # Keep compatibility with the previous deploy flow that used BACKEND_ENV_FILE_PATH.
            # Compose services read ./backend/config.env, so sync selected env file there.
            if [ "$ENV_FILE_PATH" != "$PROJECT_PATH/backend/config.env" ]; then
              cp "$ENV_FILE_PATH" "$PROJECT_PATH/backend/config.env"
            fi

            if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
              echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            fi

            # Remove legacy single-container deployment if present.
            docker rm -f "TikiTakaToeRO-backend-app" >/dev/null 2>&1 || true

            if docker compose version >/dev/null 2>&1; then
              echo "Using compose command: docker compose"
              docker compose -f "$COMPOSE_FILE" pull || true
              docker compose -f "$COMPOSE_FILE" up -d --build --remove-orphans
              docker compose -f "$COMPOSE_FILE" ps
            elif command -v docker-compose >/dev/null 2>&1; then
              echo "Using compose command: docker-compose"
              docker-compose -f "$COMPOSE_FILE" pull || true
              docker-compose -f "$COMPOSE_FILE" up -d --build --remove-orphans
              docker-compose -f "$COMPOSE_FILE" ps
            else
              echo "Neither 'docker compose' nor 'docker-compose' is available on VM"
              exit 1
            fi

            echo "Deploy completed for compose stack in $PROJECT_PATH"
