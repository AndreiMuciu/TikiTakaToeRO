services:
  redis:
    image: redis:7.4-alpine
    container_name: TikiTakaToeRO-redis
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  backend-1:
    build: ./backend
    container_name: TikiTakaToeRO-backend-app-1
    env_file:
      - ./backend/config.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  backend-2:
    build: ./backend
    container_name: TikiTakaToeRO-backend-app-2
    env_file:
      - ./backend/config.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  loadbalancer:
    image: nginx:1.27-alpine
    container_name: TikiTakaToeRO-backend-lb
    ports:
      - "5000:80"
    volumes:
      - ./infra/nginx/backend-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-1
      - backend-2
    restart: unless-stopped
    networks:
      - app-network

volumes:
  redis-data:

networks:
  app-network:
    driver: bridge
